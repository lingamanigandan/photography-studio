<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Premium Gold Gradient for Blades and Accents -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89461" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#E5C77B" />
    </linearGradient>

    <!-- Deep Charcoal Gradient for Contrast Blades -->
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3D3D" />
      <stop offset="100%" stop-color="#222222" />
    </linearGradient>

    <!-- Single Geometric Aperture Blade 
         Inner radius 45 (creates a perfect hexagon center), Outer radius 115 
    -->
    <path id="blade" 
          d="M 22.5,-38.97 L 65,-95 A 115,115 0 0,1 115,0 L 45,0 Z" 
          stroke="#FAF9F6" 
          stroke-width="3" 
          stroke-linejoin="round" />
  </defs>

  <!-- Background (Ivory) -->
  <rect width="100%" height="100%" fill="#FAF9F6" />

  <!-- 
    =========================================
    MARK: Geometric Aperture & Smile
    =========================================
  -->
  <g transform="translate(400, 210)">
    
    <!-- 6 Interlocking Aperture Blades -->
    <!-- We alternate the colors for the geometric premium look -->
    <use href="#blade" transform="rotate(0)" fill="url(#charcoalGrad)" />
    <use href="#blade" transform="rotate(60)" fill="url(#goldGrad)" />
    <use href="#blade" transform="rotate(120)" fill="url(#charcoalGrad)" />
    <use href="#blade" transform="rotate(180)" fill="url(#charcoalGrad)" />
    <use href="#blade" transform="rotate(240)" fill="url(#goldGrad)" />
    <use href="#blade" transform="rotate(300)" fill="url(#charcoalGrad)" />

    <!-- The Integrated Smile Curve inside the lens center -->
    <path d="M -20, 8 Q 0, 30 20, 8" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="6" 
          stroke-linecap="round" />
          
  </g>

  <!-- 
    =========================================
    TYPOGRAPHY
    =========================================
  -->
  <!-- Main Brand Name -->
  <text x="400" y="420" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="80" 
        font-weight="800" 
        letter-spacing="16" 
        fill="#333333" 
        text-anchor="middle">
    SMILE
  </text>
  
  <!-- Established Tagline -->
  <text x="400" y="475" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="22" 
        font-weight="600" 
        letter-spacing="8" 
        fill="#4A4A4A" 
        text-anchor="middle">
    SINCE <tspan fill="#C5A880">•</tspan> 2026
  </text>
  
  <!-- Sub-descriptor -->
  <text x="400" y="525" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="10" 
        fill="#333333" 
        text-anchor="middle">
    PHOTOGRAPHY STUDIO
  </text>
</svg>
